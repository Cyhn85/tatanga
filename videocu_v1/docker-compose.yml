version: '3.8'

# VIDEOCU v1 - Production Docker Compose Configuration
# Orchestrates all services: Database, Queue, API, Workers, Scheduler

services:
  # ========== DATABASE SERVICE ==========
  postgres:
    image: postgres:14-alpine
    container_name: videocu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videocu_db}
      POSTGRES_USER: ${POSTGRES_USER:-videocu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - videocu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videocu_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port only exposed for debugging (remove in production)
    # ports:
    #   - "5432:5432"

  # ========== QUEUE SERVICE ==========
  redis:
    image: redis:6-alpine
    container_name: videocu_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - videocu_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port only exposed for debugging (remove in production)
    # ports:
    #   - "6379:6379"

  # ========== API GATEWAY SERVICE ==========
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videocu_api
    restart: unless-stopped
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database
      POSTGRES_URL: postgresql://${POSTGRES_USER:-videocu_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-videocu_db}

      # Redis/Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # API Keys (from .env)
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}

      # Application
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./output:/app/output
      - ./modules/prompts:/app/modules/prompts
    networks:
      - videocu_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ========== CELERY WORKER SERVICE ==========
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videocu_worker
    restart: unless-stopped
    command: celery -A api_server worker --loglevel=info --concurrency=2
    environment:
      # Database
      POSTGRES_URL: postgresql://${POSTGRES_USER:-videocu_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-videocu_db}

      # Redis/Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # API Keys
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

      # Application
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./output:/app/output
      - ./modules/prompts:/app/modules/prompts
    networks:
      - videocu_network
    depends_on:
      - api
      - redis
    healthcheck:
      test: ["CMD-SHELL", "celery -A api_server inspect ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ========== CELERY BEAT SCHEDULER SERVICE ==========
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videocu_beat
    restart: unless-stopped
    command: celery -A api_server beat --loglevel=info
    environment:
      # Database
      POSTGRES_URL: postgresql://${POSTGRES_USER:-videocu_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-videocu_db}

      # Redis/Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # API Keys
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}

      # Application
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./output:/app/output
      - ./modules/prompts:/app/modules/prompts
    networks:
      - videocu_network
    depends_on:
      - api
      - redis
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'celery.*beat' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

# ========== VOLUMES ==========
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ========== NETWORKS ==========
networks:
  videocu_network:
    driver: bridge
